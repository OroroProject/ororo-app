}document.addEventListener('change',ev=>{if(ev.target.id==='houseSort'){houseSort=ev.target.value;render()}});document.addEventListener('input',ev=>{if(ev.target.id==='houseSearch'){houseSearch=ev.target.value;let pos=ev.target.selectionStart;render();let el=document.getElementById('houseSearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}});document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;let d=b.dataset;if(d.page){page=d.page;render();return}if(d.mode){houseMode=d.mode;render();return}if(d.profile){let method=document.getElementById('authMethod').value,contact=document.getElementById('authContact').value.trim(),nickname=document.getElementById('authNickname').value.trim(),country=document.getElementById('authCountry').value;if(!nickname||nickname.length<2){notify('Choose a nickname with at least 2 characters');return}if(contact&&(method==='email'?!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contact):contact.replace(/\D/g,'').length<7)){notify('Check the contact format');return}onboarding={method,contact:contact?'Provided for demo (not verified)':'Not provided',nickname,country};localStorage.setItem('ororo_v11_profile',JSON.stringify(onboarding));s.nickname=nickname;save();page='home';render();notify('Demo profile saved. No account was created on a server.');return}if(d.open){selected=all().find(x=>x.id===d.open);page='detail';render();return}if(d.join){let x=all().find(x=>x.id===d.join);if(!x)return;if(s.wallet<x.fee){notify('Insufficient demo funds');return}if(s.entries.some(e=>e.status==='waiting'&&e.houseId===x.id)){notify('You already joined this demo house');return}s.wallet-=x.fee;s.locked+=x.fee;s.entries.push({id:s.seq++,houseId:x.id,name:x.name,fee:x.fee,players:x.players,end:Date.now()+x.duration*60000,joined:[s.nickname],owner:s.nickname,status:'waiting'});txn('Reserved: '+x.name,-x.fee);page='houses';notify('Entry reserved!');save();render();return}if(d.add){let e=s.entries.find(e=>e.id===+d.add);if(e&&e.status==='waiting'){addPlayer(e);save();render()}return}if(d.fast){let e=s.entries.find(e=>e.id===+d.fast);if(e&&e.status==='waiting'){e.end=Date.now()-1000;e.voteEnd=Date.now()+900000;save();render()}return}if(d.vote){let e=s.entries.find(e=>e.id===+d.vote);if(e){vote(e,e.owner||s.nickname,d.choice);save();render()}return}if(d.simvote){let e=s.entries.find(e=>e.id===+d.simvote);if(e&&e.status==='waiting'){let p=e.joined.find(p=>!e.votes[p]);if(p){vote(e,p,d.choice||'YES');save();render()}}return}if(d.closevote){let e=s.entries.find(e=>e.id===+d.closevote);if(e&&e.status==='waiting'){finalizeVote(e);save();render()}return}if(d.cancel){let e=s.entries.find(e=>e.id===+d.cancel);if(e){settle(e,false);save();render();notify('Demo funds released')}return}if(d.share){let e=s.entries.find(x=>x.id===+d.share);if(e)shareWin(e);return}if(d.withdraw){walletDialog('withdraw');return}if(d.fund){s.wallet+=10000;txn('Demo top-up',10000);save();render();return}if(d.reset){walletDialog('reset');return}if(d.nick){let n=document.getElementById('nick').value.trim();if(n){s.nickname=n;save();notify('Nickname saved')}return}if(d.sound){s.sound=!s.sound;save();render();return}if(d.create){let name=document.getElementById('name').value.trim()||'Open House',fee=Number(document.getElementById('fee').value),players=Number(document.getElementById('players').value),duration=Number(document.getElementById('duration').value),privacy=document.getElementById('privacy').value;if(!Number.isSafeInteger(fee)||fee<1000||fee>50000000||!Number.isInteger(players)||players<2||players>500||!Number.isInteger(duration)||duration<1||duration>1440){notify('Please check the amounts and player count');return}s.custom.push({id:'custom'+s.seq++,name:name+' ('+privacy+')',fee,players,duration,icon:'🍀'});save();page='houses';render();notify('Demo house created')}});setInterval(()=>{if(page==='houses'){for(let e of s.entries.filter(e=>e.status==='waiting')){let t=document.querySelector('[data-timer="'+e.id+'"]');if(t){let r=remaining(e);t.textContent=clock(r);if(r===0&&t.dataset.expired!=='1'){e.voteEnd=e.voteEnd||e.end+900000;save();render();break}}}for(let e of s.entries.filter(e=>e.status==='waiting'&&remaining(e)===0)){e.voteEnd=e.voteEnd||e.end+900000;if(Date.now()>=e.voteEnd){finalizeVote(e);save();render();break}let vt=document.querySelector('[data-votetimer="'+e.id+'"]');if(vt)vt.textContent=clock(Math.max(0,Math.ceil((e.voteEnd-Date.now())/1000)))}}},1000);if(!onboarding)page='account';render();document.addEventListener('click',e=>{if(e.target.closest('[data-page=houses]'))setTimeout(loadLiveHouse,250)});})();

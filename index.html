<script>
/* ORORO V17.1: preserve DOM nodes during background refreshes.
   Network polling may continue, but only values that actually change are patched. */
window.ororoPatchMarkup=function(container,markup){
  if(!container)return;
  const template=document.createElement('template');
  template.innerHTML=markup;
  function sameType(a,b){return a.nodeType===b.nodeType &&
    (a.nodeType!==1 || a.tagName===b.tagName);}
  function syncChildren(parent,desired){
    const wanted=Array.from(desired.childNodes);
    for(let i=0;i<wanted.length;i++){
      const old=parent.childNodes[i],next=wanted[i];
      if(!old){parent.appendChild(next.cloneNode(true));continue;}
      if(!sameType(old,next)){
        parent.replaceChild(next.cloneNode(true),old);
      }else{
        syncNode(old,next);
      }
    }
    while(parent.childNodes.length>wanted.length)parent.removeChild(parent.lastChild);
  }
  function syncNode(old,next){
    if(old.nodeType===3 || old.nodeType===8){
      if(old.nodeValue!==next.nodeValue)old.nodeValue=next.nodeValue;
      return;
    }
    if(old.nodeType!==1)return;
    const oldAttributes=Array.from(old.attributes);
    for(const attribute of oldAttributes)
      if(!next.hasAttribute(attribute.name))old.removeAttribute(attribute.name);
    for(const attribute of Array.from(next.attributes))
      if(old.getAttribute(attribute.name)!==attribute.value)
        old.setAttribute(attribute.name,attribute.value);
    // Keep focused inputs and their typed values intact during background refreshes.
    if(old!==document.activeElement && old instanceof HTMLInputElement &&
       old.value!==next.value)old.value=next.value;
    syncChildren(old,next);
  }
  syncChildren(container,template.content);
};
</script>

 let msg='⚙️ Checking server automation…';
 if(cachedAutomation)msg=cachedAutomation.active
  ?'✅ Automatic house manager active · Last server check: '+escapeHTML(when(cachedAutomation.last_tick))
  :'⚠️ Automatic house manager not running yet. Install the V17 Supabase Cron job (02 SQL).';
 return '<div class="v16-status">'+msg+'<p class="v16-muted">Server checks occur about once per minute, even if both phones are closed. New rounds open automatically when someone visits after a completed round. No actual payments occur.</p></div>';
}
function draw(){
 const houseEl=$('ororoV16House');
 if(houseEl){
   const isNextRound=!!(cachedRecent && cachedHouse &&
     cachedRecent.house_id!==cachedHouse.house_id &&
     (cachedRecent.status==='completed'||cachedRecent.status==='cancelled'));
   const past=isNextRound?'<div class="v16-panel"><h2>🏆 Previous draw has finished</h2>'+recentResultCard(cachedRecent)+'</div>':'';
   const base=houseCard(cachedHouse,cachedWallet);
   // Display the finished result BEFORE the new house, rather than silently replacing it.
   const markup=past+base.replace('<div class="v16-panel">','<div class="v16-panel">'+automationCard());
   window.ororoPatchMarkup(houseEl,markup);
 }
 const walletEl=$('ororoV16Wallet');
 if(walletEl)window.ororoPatchMarkup(walletEl,walletCard(cachedWallet));
 updateClock();
}
async function load(){
 if(!($('ororoV16House')||$('ororoV16Wallet'))||busy)return;
 busy=true;const houseEl=$('ororoV16House');/* Silent refresh: keep existing UI stable while the request runs. */
 try{
   const c=getClient();if(!c)throw Error('Supabase is unavailable. Check your connection.');
   const {data,error}=await c.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')throw error;
   if(!data?.user){cachedHouse=null;cachedWallet=null;activeAccount=null;showError('Sign in under Settings → Account, then revisit Houses or Wallet.');return;}
   if(activeAccount!==data.user.id){activeAccount=data.user.id;cachedHouse=null;cachedWallet=null;cachedRecent=null;}
   // Demand-driven next round: on visiting ORORO, open one fresh demo house
   // if the previous round is complete; advisory locking prevents duplicates.
   cachedEnsure=await rpc('ororo_v17_ensure_round');
   cachedHouse=await rpc('ororo_v16_house_snapshot');
   cachedWallet=await rpc('ororo_v16_wallet_snapshot');
   const extras=await Promise.allSettled([rpc('ororo_v17_manager_status'),rpc('ororo_v17_recent_result')]);
   cachedAutomation=extras[0].status==='fulfilled'?extras[0].value:null;
   cachedRecent=extras[1].status==='fulfilled'?extras[1].value:null;
   lastLoad=Date.now();draw();
 }catch(e){showError('V17 connection error: '+(e.message||String(e))+'. If setup SQL has not been installed, run it once in Supabase.');}
 finally{busy=false;}
}
async function doAction(action){
 if(busy)return;const h=cachedHouse;
 if(!h){toast('Refresh the ORORO house first');return;}
 const btn=$(action==='join'?'v16Join':action==='yes'?'v16Yes':'v16No');
 if(btn)btn.disabled=true;
 try{
  const result=action==='join' ? await rpc('ororo_v16_join',{p_house_id:h.house_id})
  : await rpc('ororo_v16_cast_vote',{p_house_id:h.house_id,p_vote:action});
  toast('🍀 '+result);await load();
 }catch(e){toast('ORORO demo: '+(e.message||String(e)));if(btn)btn.disabled=false;}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 const id=b.id;
 if(id==='v16Refresh'){e.stopImmediatePropagation();load();}
 if(id==='v16Join'){e.stopImmediatePropagation();doAction('join');}
 if(id==='v16Yes'){e.stopImmediatePropagation();doAction('yes');}
 if(id==='v16No'){e.stopImmediatePropagation();doAction('no');}
},true);
// The existing ORORO navigation re-renders #view. Reconnect our widgets
// whenever the user switches between Houses, Wallet, and other screens.
const observer=new MutationObserver(()=>{if($('ororoV16House')||$('ororoV16Wallet'))load();});
observer.observe(ROOT,{childList:true});
setInterval(()=>{if(!document.hidden&&($('ororoV16House')||$('ororoV16Wallet'))&&Date.now()-lastLoad>=11000)load();updateClock();},1000);
if($('ororoV16House')||$('ororoV16Wallet'))load();
})();
</script>
</body></html>
